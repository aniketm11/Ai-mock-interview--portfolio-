<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview Studio</title><link rel="stylesheet" href="/frontend/styles.css"></head><body><header><b>✦ Interview Studio</b><button id="theme">Dark mode</button></header><main><section id="auth"><p class="eyebrow">SECURE ACCESS</p><h1>Interview Studio</h1><form id="auth-form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="10" placeholder="Password (10+ characters)" required><button>Sign in</button><button id="register" type="button">Create account</button><p id="auth-error"></p></form></section><section id="setup" hidden><p class="eyebrow">VOICE-ONLY AI INTERVIEW</p><h1>Ready for the real conversation.</h1><form id="start-form"><input name="role" required placeholder="Target role"><select name="level"><option value="junior">Junior</option><option value="mid">Mid-level</option><option value="senior">Senior</option></select><input name="skills" required placeholder="Skills, comma separated"><textarea name="jobDescription" placeholder="Job description"></textarea><input name="resume" type="file" accept=".pdf,.txt"><button>Start voice interview</button></form></section><section id="room" hidden><aside><p id="progress"></p><ol id="timeline"></ol><p id="mic-status">Microphone: preparing</p><p id="camera-status">Camera: preparing</p></aside><article><video id="camera" autoplay muted playsinline></video><p id="question"></p><button id="listen">Listen again</button><p id="transcript">Live transcript will appear here.</p><button id="answer">Start answer</button><div id="feedback" hidden><h2 id="overall"></h2><div id="scores"></div><p id="feedback-text"></p><p id="follow-up"></p><button id="next">Next question</button></div></article></section><section id="finish" hidden><h1>Interview complete</h1><a id="report">Download professional PDF report</a></section></main><script type="module" src="/frontend/application.js"></script></body></html>
